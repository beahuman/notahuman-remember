name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Syntax check
      run: |
        python -m py_compile src/nah_remember/*.py
        python -m py_compile server.py nah_remember_phase3.py

    - name: Verify CLI entry point
      run: |
        nah-remember --version

    - name: Run test suite
      run: |
        pytest -v tests/
