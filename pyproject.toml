[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nah-remember"
version = "0.2.0"
description = "Unified MCP server for nah-remember (PostgreSQL + pgvector long-term memory)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
nah-remember = "server:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["consolidation*", "distillation*"]
exclude = ["dashboard*", "logs*", "migrations*", "venv*", "tests*"]

[tool.setuptools]
py-modules = ["server", "nah_remember_phase3", "context_compaction", "promote_to_brain", "backfill_embeddings"]
